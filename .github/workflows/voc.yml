name: VOC Radar weekly run

on:
  schedule:
    # Mondays 11:00 UTC (~6-7am US Eastern)
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Reporting window in days"
        default: "7"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voc-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, analyze, report
        env:
          # Optional: add ANTHROPIC_API_KEY as a repo secret to enable the
          # Claude insight brief. The run works without it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required for Reddit collection from CI: Reddit blocks
          # unauthenticated requests from cloud IPs. Create a free "script"
          # app at https://www.reddit.com/prefs/apps and add both secrets.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python -m voc run --days "${{ github.event.inputs.days || '7' }}" -v

      - name: Commit data and reports
        run: |
          git config user.name "voc-radar[bot]"
          git config user.email "voc-radar@users.noreply.github.com"
          git add data/voc.db reports/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "VOC Radar: scheduled run $(date -u +%F)"
            git push
          fi

      # --- GitHub Pages: publish the dashboard at the site root ---
      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp -r reports/. _site/
          cp reports/dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job so a Pages hiccup never marks the data run as failed.
  publish:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Enable Pages (first run only, no-op afterwards)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
