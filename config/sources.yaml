# Information sources for the EMS VOC Radar.
#
# Three collector types:
#   rss    - RSS/Atom feeds from trade publications
#   reddit - subreddit listings via Reddit's public JSON API (no auth required)
#   web    - competitor news/press pages scraped with a CSS selector
#
# Feeds occasionally move or go down; every source is fetched independently and
# a failure is logged without aborting the run.

rss:
  - name: SDM Magazine
    url: https://www.sdmmag.com/rss/articles
  - name: Security Sales & Integration
    url: https://www.securitysales.com/feed/
  - name: Campus Safety Magazine
    url: https://www.campussafetymagazine.com/feed/
  # Publications without a working native feed are covered via Google News
  # RSS site searches — stable and CI-friendly.
  - name: Locksmith Ledger
    url: "https://news.google.com/rss/search?q=site:locksmithledger.com&hl=en-US&gl=US&ceid=US:en"
  - name: Security Info Watch
    url: "https://news.google.com/rss/search?q=site:securityinfowatch.com%20%22access%20control%22&hl=en-US&gl=US&ceid=US:en"
  - name: Door hardware news (Google News)
    url: "https://news.google.com/rss/search?q=%22electric%20strike%22%20OR%20%22maglock%22%20OR%20%22panic%20hardware%22%20OR%20%22exit%20device%22&hl=en-US&gl=US&ceid=US:en"

reddit:
  - subreddit: accesscontrol
    listings: [new, top]      # top uses t=week
    limit: 100
  - subreddit: Locksmith
    listings: [new]
    limit: 100
  - subreddit: CommercialAV   # occasional door hardware / access integration chatter
    listings: [new]
    limit: 50

web:
  # Competitor and adjacent-brand news pages. item_selector should match the
  # anchor elements of headline links on the page.
  - name: Allegion (Von Duprin / Schlage) newsroom
    url: https://www.allegion.com/corp/en/news.html
    item_selector: "a[href*='news']"
  - name: Camden Door Controls news
    url: https://www.camdencontrols.com/news
    item_selector: "a[href*='news']"

# Competitors without a scrapeable news page are tracked via Google News RSS
# brand searches (handled by the rss collector).
competitor_news_rss:
  - name: dormakaba news (Google News)
    url: "https://news.google.com/rss/search?q=dormakaba&hl=en-US&gl=US&ceid=US:en"
  - name: SDC news (Google News)
    url: "https://news.google.com/rss/search?q=%22Security%20Door%20Controls%22&hl=en-US&gl=US&ceid=US:en"
  - name: Detex news (Google News)
    url: "https://news.google.com/rss/search?q=%22Detex%22%20door&hl=en-US&gl=US&ceid=US:en"
  - name: Command Access news (Google News)
    url: "https://news.google.com/rss/search?q=%22Command%20Access%20Technologies%22&hl=en-US&gl=US&ceid=US:en"
  - name: Von Duprin / Allegion news (Google News)
    url: "https://news.google.com/rss/search?q=%22Von%20Duprin%22%20OR%20%22Allegion%22&hl=en-US&gl=US&ceid=US:en"
